name: CI
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.8.3

    - name: Lint
      run: deno lint

  tag:
    # Only tag master pushes, and only if linting passed.
    needs: lint
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Expose the new tag so the sync job can publish it to S3.
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Full history so the tag action can find the previous tag.
        fetch-depth: 0

    # Bumps major/minor/patch from the commit message (Conventional Commits:
    # feat: -> minor, fix: -> patch, BREAKING CHANGE / ! -> major), defaulting
    # to a patch bump otherwise, then pushes the new vX.Y.Z tag.
    - name: Push version tag
      id: tag
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch
