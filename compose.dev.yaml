# Development: `docker compose -f compose.yaml -f compose.dev.yaml up --build`.
# Serves the frontend from your checkout, rebuilds it and restarts the backend
# when files change, and catches email in Mailpit at http://localhost:8025.

services:
  proxy:
    volumes:
      - .:/srv/site:ro
      - frontend:/srv/dist:ro

  frontend:
    build: { context: ., target: deps }
    command: npx esbuild src/main.ts --bundle --format=esm --outdir=dist --loader:.png=file --watch=forever
    volumes:
      - ./src:/app/src:ro
      - ./shared:/app/shared:ro
      - frontend:/app/dist

  backend:
    command: node --watch backend/main.ts
    volumes:
      - ./backend:/app/backend:ro
      - ./shared:/app/shared:ro
      - ./scripts:/app/scripts:ro
      - ./layers:/app/layers:ro

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

volumes:
  frontend:
